<body>
<p>Loading the portfolio… <a id="go" href="index.dc.html">Continue</a></p>
<script>
/* Carry the query string and hash through the redirect. Dropping them is what
   kept ?admin=1 from ever reaching index.dc.html, so admin mode was
   unreachable from the bare site URL. */
(function () {
  var to = 'index.dc.html' + (location.search || '') + (location.hash || '');
  var a = document.getElementById('go');
  if (a) a.href = to;
  location.replace(to);
})();
</script>
</body>
